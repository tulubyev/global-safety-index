# ============================================================
#  Safety Index — production (Docker + Traefik)
#
#  Запуск на VPS:
#    docker compose -f docker-compose.prod.yml up -d --build
#
#  Обновление:
#    docker compose -f docker-compose.prod.yml pull
#    docker compose -f docker-compose.prod.yml up -d --build
#
#  Логи:
#    docker compose -f docker-compose.prod.yml logs -f
# ============================================================

services:

  # ── Backend API ───────────────────────────────────────────
  safety-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safety-api
    restart: always
    expose:
      - "3001"
    env_file: ./backend/.env
    networks:
      - traefik-public
      - safety-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.safety-api.rule=Host(`worldsafetyindex.org`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.safety-api.entrypoints=websecure"
      - "traefik.http.routers.safety-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.safety-api.priority=20"
      - "traefik.http.services.safety-api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────
  safety-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safety-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://worldsafetyindex.org
    depends_on:
      safety-api:
        condition: service_healthy
    networks:
      - traefik-public
      - safety-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.safety.rule=Host(`worldsafetyindex.org`) || Host(`www.worldsafetyindex.org`)"
      - "traefik.http.routers.safety.entrypoints=websecure"
      - "traefik.http.routers.safety.tls.certresolver=letsencrypt"
      - "traefik.http.routers.safety.priority=10"
      - "traefik.http.services.safety.loadbalancer.server.port=3000"

networks:
  traefik-public:
    name: traefik-public
    external: true        # общая сеть Traefik — уже существует
  safety-internal:
    driver: bridge        # изолированная сеть этого проекта
